[package]
name = "minirun"
version = "0.1.0"
edition = "2024"
description = "Measure cold-start of a containerised workload (p50/p99)"
license = "MIT"
authors = ["Ihor Petrov <ihorpetroff@gmail.com>"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
